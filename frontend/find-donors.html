<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find Donors</title>
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
</head>
<body>

<header>
    <div class="logo">🩸 BloodConnect</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="register.html">Register</a>
        <a href="request.html">Blood Request</a>
        <a href="find-donors.html">Find Donors</a>
    </nav>
</header>

<section class="page-title">
    <h1>Find Blood Donors</h1>
    <p>Search Donors by Blood Group and City</p>
</section>

<div class="container">

    <form id="searchForm">

        <select id="searchBlood" required>
            <option value="">Select Blood Group</option>
            <option>A+</option>
            <option>A-</option>
            <option>B+</option>
            <option>B-</option>
            <option>O+</option>
            <option>O-</option>
            <option>AB+</option>
            <option>AB-</option>
        </select>

        <input type="text" id="searchCity"
        placeholder="Enter City" required>

        <button type="submit">Search Donors</button>

    </form>

    <div id="donorResults"></div>

</div>

<footer>
    <h3>🩸 BloodConnect</h3>
    <p>Every Blood Donor is a Life Saver.</p>
</footer>

</body>
</html>
